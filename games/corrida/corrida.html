<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>STREET RACING • Corrida</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    user-select:none;
}

html,
body,
#jogo{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
}

body{
    font-family:Arial,Helvetica,sans-serif;
}

canvas{
    display:block;
}

/* HUD */
#hud{
    position:fixed;
    top:12px;
    left:12px;
    right:12px;
    z-index:10;

    display:flex;
    justify-content:space-between;

    pointer-events:none;
}

.box{
    background:#000b;
    color:#fff;

    border:1px solid #ffffff33;
    border-radius:12px;

    padding:9px 13px;
    min-width:120px;
}

.box small{
    display:block;
    color:#aaa;
    font-size:10px;
    text-transform:uppercase;
}

.box strong{
    font-size:22px;
}

#vel{
    color:#00e5ff;
}

/* CONTROLES */
#controls{
    position:fixed;
    bottom:18px;
    left:0;
    right:0;

    z-index:20;

    display:flex;
    justify-content:space-between;

    padding:0 18px;

    pointer-events:none;
}

.group{
    display:flex;
    gap:10px;

    pointer-events:auto;
}

.btn{
    width:70px;
    height:70px;

    border-radius:50%;
    border:2px solid #ffffff66;

    background:#0009;
    color:#fff;

    font-size:27px;
    font-weight:bold;

    touch-action:none;
}

.btn:active{
    transform:scale(.93);
    background:#00bcd455;
}

/* IMPACTO */
#impact{
    position:fixed;
    inset:0;

    z-index:30;

    pointer-events:none;

    display:none;

    border:8px solid #f22;
    box-shadow:inset 0 0 70px #f004;
}

/* RESULTADO */
#result{
    position:fixed;
    inset:0;

    z-index:50;

    display:none;

    align-items:center;
    justify-content:center;

    background:#000c;
}

.card{
    width:min(90%,390px);

    padding:28px;

    border-radius:20px;

    background:#101015;

    border:1px solid #00d9ff66;

    color:#fff;

    text-align:center;
}

.card h1{
    color:#00e5ff;
    margin-bottom:20px;
}

.row{
    display:flex;
    justify-content:space-between;

    padding:10px 0;

    border-bottom:1px solid #ffffff15;
}

.card button{
    width:100%;

    margin-top:22px;

    padding:14px;

    border:0;
    border-radius:10px;

    background:#00d9ff;

    font-weight:bold;
}
</style>
</head>

<body>

<div id="jogo"></div>

<!-- HUD -->
<div id="hud">

    <div class="box">
        <small>Velocidade</small>
        <strong>
            <span id="vel">0</span> km/h
        </strong>
    </div>

    <div class="box">
        <small>Distância</small>
        <strong>
            <span id="dist">0</span> m
        </strong>
    </div>

</div>

<!-- CONTROLES -->
<div id="controls">

    <div class="group">

        <button class="btn" id="left">
            ◀
        </button>

        <button class="btn" id="right">
            ▶
        </button>

    </div>

    <div class="group">

        <button class="btn" id="brake">
            ▼
        </button>

        <button class="btn" id="gas">
            ▲
        </button>

    </div>

</div>

<div id="impact"></div>

<!-- RESULTADO -->
<div id="result">

    <div class="card">

        <h1>🏁 CORRIDA FINALIZADA</h1>

        <div class="row">
            <span>Distância</span>
            <b id="rDist">0 m</b>
        </div>

        <div class="row">
            <span>Velocidade máxima</span>
            <b id="rMax">0 km/h</b>
        </div>

        <button id="garage">
            VOLTAR PARA GARAGEM
        </button>

    </div>

</div>

<script type="module">

/* =========================================================
   FIREBASE
========================================================= */

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
    getAuth,
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


/* =========================================================
   THREE.JS
========================================================= */

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";


/* =========================================================
   FIREBASE CONFIG
========================================================= */

const firebaseConfig = {

    apiKey:
    "AIzaSyDaAt6kwcnwh6KWFkMdItI_aP-5aNlYiEg",

    authDomain:
    "jogo-92290.firebaseapp.com",

    projectId:
    "jogo-92290",

    storageBucket:
    "jogo-92290.firebasestorage.app",

    messagingSenderId:
    "237105815783",

    appId:
    "1:237105815783:web:51616c54633cedc2880242"

};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);


/* =========================================================
   VARIÁVEIS DO JOGO
========================================================= */

let scene;
let camera;
let renderer;

let player;

let enemies = [];

let roadMarks = [];

let speed = 0;
let distance = 0;
let maxSpeed = 0;

let x = 0;

let gas = false;
let brake = false;
let left = false;
let right = false;

let finished = false;

let last = performance.now();


/* =========================================================
   AUTENTICAÇÃO
========================================================= */

onAuthStateChanged(auth, user => {

    if(!user){

        location.href = "index.html";

        return;
    }

    iniciar();

});


/* =========================================================
   INICIAR
========================================================= */

function iniciar(){

    scene = new THREE.Scene();

    scene.background =
        new THREE.Color(0x72add5);

    scene.fog =
        new THREE.Fog(
            0x72add5,
            80,
            430
        );


    /* CAMERA */

    camera =
        new THREE.PerspectiveCamera(
            65,
            innerWidth / innerHeight,
            0.1,
            700
        );

    camera.position.set(
        0,
        5.5,
        11
    );


    /* RENDER */

    renderer =
        new THREE.WebGLRenderer({
            antialias:true
        });

    renderer.setPixelRatio(
        Math.min(devicePixelRatio,2)
    );

    renderer.setSize(
        innerWidth,
        innerHeight
    );

    renderer.shadowMap.enabled = true;


    document
        .getElementById("jogo")
        .appendChild(renderer.domElement);


    /* LUZ */

    scene.add(
        new THREE.HemisphereLight(
            0xffffff,
            0x34552f,
            2
        )
    );


    const sun =
        new THREE.DirectionalLight(
            0xffffff,
            3
        );

    sun.position.set(
        -40,
        80,
        50
    );

    sun.castShadow = true;

    scene.add(sun);


    /* MUNDO */

    criarMundo();


    /* CARRO DO JOGADOR */

    player =
        criarCarro(0xd50000);

    player.position.set(
        0,
        0,
        5
    );

    scene.add(player);


    /* OPONENTES */

    for(let i=0;i<7;i++){

        const cores = [
            0x1565c0,
            0xffffff,
            0xff8800,
            0x151515,
            0x00a86b
        ];

        const carro =
            criarCarro(
                cores[i % cores.length]
            );


        carro.position.set(

            [-5.5,0,5.5][i % 3],

            0,

            -80 - i * 75

        );


        scene.add(carro);

        enemies.push(carro);

    }


    controles();

    addEventListener(
        "resize",
        resize
    );


    requestAnimationFrame(loop);

}


/* =========================================================
   CRIAR MUNDO
========================================================= */

function criarMundo(){

    /* GRAMA */

    const grass =
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                500,
                900
            ),

            new THREE.MeshStandardMaterial({
                color:0x3d7137
            })

        );


    grass.rotation.x =
        -Math.PI / 2;


    grass.position.set(
        0,
        -0.05,
        -300
    );


    grass.receiveShadow = true;

    scene.add(grass);


    /* PISTA */

    const road =
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                18,
                900
            ),

            new THREE.MeshStandardMaterial({
                color:0x292929
            })

        );


    road.rotation.x =
        -Math.PI / 2;


    road.position.z =
        -300;


    road.receiveShadow = true;

    scene.add(road);


    /* LATERAIS */

    for(const xx of [-10,10]){

        const edge =
            new THREE.Mesh(

                new THREE.BoxGeometry(
                    1.4,
                    0.04,
                    900
                ),

                new THREE.MeshStandardMaterial({
                    color:0xd8d8d8
                })

            );


        edge.position.set(
            xx,
            0.02,
            -300
        );


        scene.add(edge);

    }


    /* FAIXAS CENTRAIS */

    for(let i=0;i<90;i++){

        const mark =
            new THREE.Mesh(

                new THREE.BoxGeometry(
                    0.32,
                    0.05,
                    5
                ),

                new THREE.MeshStandardMaterial({
                    color:0xffffff
                })

            );


        mark.position.set(
            0,
            0.04,
            -i * 10
        );


        scene.add(mark);

        roadMarks.push(mark);

    }


    /* PRÉDIOS */

    for(let i=0;i<55;i++){

        const side =
            i % 2 ? -1 : 1;

        criarPredio(

            side *
            (17 + Math.random() * 20),

            -20 - i * 17,

            5 + Math.random() * 18

        );

    }


    /* ÁRVORES */

    for(let i=0;i<45;i++){

        const side =
            i % 2 ? -1 : 1;

        criarArvore(

            side *
            (15 + Math.random() * 17),

            -30 - i * 22

        );

    }

}


/* =========================================================
   PRÉDIOS
========================================================= */

function criarPredio(px,pz,h){

    const b =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                6 + Math.random() * 5,
                h,
                6 + Math.random() * 5
            ),

            new THREE.MeshStandardMaterial({
                color:0x555966
            })

        );


    b.position.set(
        px,
        h / 2,
        pz
    );


    b.castShadow = true;

    scene.add(b);

}


/* =========================================================
   ÁRVORE
========================================================= */

function criarArvore(px,pz){

    const tronco =
        new THREE.Mesh(

            new THREE.CylinderGeometry(
                0.3,
                0.45,
                3,
                8
            ),

            new THREE.MeshStandardMaterial({
                color:0x5b3822
            })

        );


    tronco.position.set(
        px,
        1.5,
        pz
    );


    scene.add(tronco);


    const copa =
        new THREE.Mesh(

            new THREE.SphereGeometry(
                2.3,
                10,
                8
            ),

            new THREE.MeshStandardMaterial({
                color:0x17602b
            })

        );


    copa.position.set(
        px,
        4,
        pz
    );


    copa.castShadow = true;

    scene.add(copa);

}


/* =========================================================
   CRIAR CARRO
========================================================= */

function criarCarro(color){

    const g =
        new THREE.Group();


    /* CARROCERIA */

    const body =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                2.35,
                0.65,
                4.5
            ),

            new THREE.MeshStandardMaterial({

                color:color,

                metalness:0.6,

                roughness:0.3

            })

        );


    body.position.y =
        0.75;


    body.castShadow = true;

    g.add(body);


    /* TETO */

    const roof =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                1.65,
                0.62,
                2
            ),

            new THREE.MeshStandardMaterial({
                color:0x151515,
                metalness:0.4
            })

        );


    roof.position.set(
        0,
        1.25,
        -0.2
    );


    g.add(roof);


    /* VIDRO */

    const glass =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                1.5,
                0.42,
                0.08
            ),

            new THREE.MeshStandardMaterial({
                color:0x18354b,
                metalness:0.2
            })

        );


    glass.position.set(
        0,
        1.3,
        0.75
    );


    glass.rotation.x =
        -0.25;


    g.add(glass);


    /* RODAS */

    const wg =
        new THREE.CylinderGeometry(
            0.42,
            0.42,
            0.32,
            16
        );


    const wm =
        new THREE.MeshStandardMaterial({
            color:0x050505
        });


    const rodas = [

        [-1.22,0.45,1.45],
        [1.22,0.45,1.45],
        [-1.22,0.45,-1.45],
        [1.22,0.45,-1.45]

    ];


    for(const p of rodas){

        const w =
            new THREE.Mesh(
                wg,
                wm
            );


        w.rotation.z =
            Math.PI / 2;


        w.position.set(
            ...p
        );


        g.add(w);

    }


    /* FARÓIS */

    for(const xx of [-0.7,0.7]){

        const h =
            new THREE.Mesh(

                new THREE.BoxGeometry(
                    0.4,
                    0.18,
                    0.08
                ),

                new THREE.MeshBasicMaterial({
                    color:0xffffdd
                })

            );


        h.position.set(
            xx,
            0.88,
            2.28
        );


        g.add(h);

    }


    return g;

}


/* =========================================================
   CONTROLES MOBILE
========================================================= */

function bind(id,on,off){

    const b =
        document.getElementById(id);


    b.addEventListener(
        "pointerdown",
        e => {

            e.preventDefault();

            on();

        }
    );


    b.addEventListener(
        "pointerup",
        e => {

            e.preventDefault();

            off();

        }
    );


    b.addEventListener(
        "pointercancel",
        off
    );


    b.addEventListener(
        "pointerleave",
        off
    );

}


/* =========================================================
   CONTROLES
========================================================= */

function controles(){

    bind(
        "left",
        () => left = true,
        () => left = false
    );


    bind(
        "right",
        () => right = true,
        () => right = false
    );


    bind(
        "gas",
        () => gas = true,
        () => gas = false
    );


    bind(
        "brake",
        () => brake = true,
        () => brake = false
    );


    /* TECLADO */

    addEventListener(
        "keydown",
        e => {

            if(
                e.key === "ArrowLeft" ||
                e.key.toLowerCase() === "a"
            ){
                left = true;
            }


            if(
                e.key === "ArrowRight" ||
                e.key.toLowerCase() === "d"
            ){
                right = true;
            }


            if(
                e.key === "ArrowUp" ||
                e.key.toLowerCase() === "w"
            ){
                gas = true;
            }


            if(
                e.key === "ArrowDown" ||
                e.key.toLowerCase() === "s"
            ){
                brake = true;
            }

        }
    );


    addEventListener(
        "keyup",
        e => {

            if(
                e.key === "ArrowLeft" ||
                e.key.toLowerCase() === "a"
            ){
                left = false;
            }


            if(
                e.key === "ArrowRight" ||
                e.key.toLowerCase() === "d"
            ){
                right = false;
            }


            if(
                e.key === "ArrowUp" ||
                e.key.toLowerCase() === "w"
            ){
                gas = false;
            }


            if(
                e.key === "ArrowDown" ||
                e.key.toLowerCase() === "s"
            ){
                brake = false;
            }

        }
    );


    /* VOLTAR PARA GARAGEM */

    document
        .getElementById("garage")
        .onclick = () => {

            location.href =
                "garagem.html";

        };

}


/* =========================================================
   ATUALIZAÇÃO DA CORRIDA
========================================================= */

function atualizar(dt){

    /* ACELERAÇÃO */

    if(gas){

        speed +=
            65 * dt;

    }else{

        speed -=
            18 * dt;

    }


    /* FREIO */

    if(brake){

        speed -=
            110 * dt;

    }


    speed =
        THREE.MathUtils.clamp(
            speed,
            0,
            180
        );


    maxSpeed =
        Math.max(
            maxSpeed,
            speed
        );


    /* DIREÇÃO */

    let dir =
        (right ? 1 : 0) -
        (left ? 1 : 0);


    x +=
        dir *
        (8 + speed * 0.045) *
        dt;


    x =
        THREE.MathUtils.clamp(
            x,
            -7.2,
            7.2
        );


    /* POSIÇÃO DO CARRO */

    player.position.x =
        x;


    /* INCLINAÇÃO */

    player.rotation.z =
        THREE.MathUtils.lerp(
            player.rotation.z,
            -dir * 0.1,
            0.15
        );


    player.rotation.y =
        THREE.MathUtils.lerp(
            player.rotation.y,
            -dir * 0.035,
            0.12
        );


    /* DISTÂNCIA */

    distance +=
        speed *
        dt *
        0.75;


    /* VELOCIDADE DO MUNDO */

    const move =
        speed *
        dt *
        0.95;


    /* FAIXAS */

    for(const m of roadMarks){

        m.position.z += move;


        if(m.position.z > 15){

            m.position.z -= 900;

        }

    }


    /* OPONENTES */

    for(const c of enemies){

        c.position.z += move;


        if(c.position.z > 25){

            c.position.z =
                -500 -
                Math.random() * 180;


            c.position.x =
                [-5.5,0,5.5][
                    Math.floor(
                        Math.random() * 3
                    )
                ];

        }

    }


    /* COLISÕES */

    for(const c of enemies){

        if(

            c.position.z > -9 &&

            c.position.z < 11 &&

            Math.abs(
                c.position.x -
                player.position.x
            ) < 2.1

        ){

            /* PERDE VELOCIDADE */

            speed *= 0.25;


            /* EMPURRA OPONENTE */

            c.position.z -= 7;


            /* EFEITO DE IMPACTO */

            const impact =
                document.getElementById(
                    "impact"
                );


            impact.style.display =
                "block";


            setTimeout(
                () => {

                    impact.style.display =
                        "none";

                },
                350
            );

        }

    }


    /* CÂMERA */

    camera.position.x =
        THREE.MathUtils.lerp(
            camera.position.x,
            x * 0.32,
            0.08
        );


    camera.lookAt(
        x * 0.15,
        0.8,
        -35
    );


    /* HUD */

    document
        .getElementById("vel")
        .textContent =
        Math.round(speed);


    document
        .getElementById("dist")
        .textContent =
        Math.floor(distance);


    /* FINAL */

    if(distance >= 1000){

        finalizar();

    }

}


/* =========================================================
   FINALIZAR
========================================================= */

function finalizar(){

    if(finished){

        return;

    }


    finished = true;


    document
        .getElementById("rDist")
        .textContent =
        Math.floor(distance) + " m";


    document
        .getElementById("rMax")
        .textContent =
        Math.round(maxSpeed) + " km/h";


    document
        .getElementById("result")
        .style.display =
        "flex";

}


/* =========================================================
   LOOP
========================================================= */

function loop(){

    if(finished){

        renderer.render(
            scene,
            camera
        );

        return;

    }


    const now =
        performance.now();


    const dt =
        Math.min(
            (now - last) / 1000,
            0.05
        );


    last = now;


    atualizar(dt);


    renderer.render(
        scene,
        camera
    );


    requestAnimationFrame(loop);

}


/* =========================================================
   RESIZE
========================================================= */

function resize(){

    camera.aspect =
        innerWidth /
        innerHeight;


    camera.updateProjectionMatrix();


    renderer.setSize(
        innerWidth,
        innerHeight
    );

}

</script>

</body>
</html>
