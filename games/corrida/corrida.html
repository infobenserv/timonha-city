<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>STREET RACING • Corrida V3</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;user-select:none}html,body,#jogo{width:100%;height:100%;overflow:hidden;background:#000}body{font-family:Arial,Helvetica,sans-serif}canvas{display:block}
#hud{position:fixed;top:12px;left:12px;right:12px;z-index:10;display:flex;justify-content:space-between;pointer-events:none}.box{background:#000b;color:#fff;border:1px solid #ffffff33;border-radius:12px;padding:9px 13px;min-width:120px}.box small{display:block;color:#aaa;font-size:10px;text-transform:uppercase}.box strong{font-size:22px}#vel{color:#00e5ff}
#controls{position:fixed;bottom:18px;left:0;right:0;z-index:20;display:flex;justify-content:space-between;padding:0 18px;pointer-events:none}.group{display:flex;gap:10px;pointer-events:auto}.btn{width:70px;height:70px;border-radius:50%;border:2px solid #ffffff66;background:#0009;color:#fff;font-size:27px;font-weight:bold;touch-action:none}.btn:active{transform:scale(.93);background:#00bcd455}
#sound{position:fixed;right:12px;top:76px;z-index:25;border:1px solid #ffffff55;border-radius:10px;background:#000b;color:#fff;padding:9px 12px;font-weight:bold}#impact{position:fixed;inset:0;z-index:30;pointer-events:none;display:none;border:8px solid #f22;box-shadow:inset 0 0 70px #f004}
#map{position:fixed;right:12px;top:125px;width:145px;height:105px;z-index:15;background:#000b;border:1px solid #ffffff55;border-radius:10px;overflow:hidden}#map canvas{width:100%;height:100%}
#checkpoint{position:fixed;left:50%;top:78px;transform:translateX(-50%);z-index:16;background:#000b;color:#fff;border:1px solid #00e5ff66;border-radius:10px;padding:7px 12px;font-size:12px;font-weight:bold;display:none}
#result{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:#000c}.card{width:min(90%,390px);padding:28px;border-radius:20px;background:#101015;border:1px solid #00d9ff66;color:#fff;text-align:center}.card h1{color:#00e5ff;margin-bottom:20px}.row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #ffffff15}.card button{width:100%;margin-top:22px;padding:14px;border:0;border-radius:10px;background:#00d9ff;font-weight:bold}
</style></head><body>
<div id="jogo"></div>
<div id="hud"><div class="box"><small>Velocidade</small><strong><span id="vel">0</span> km/h</strong></div><div class="box"><small>Distância</small><strong><span id="dist">0</span> m</strong></div></div>
<button id="sound">🔊 SOM</button><div id="map"><canvas id="mapCanvas" width="290" height="210"></canvas></div><div id="checkpoint">CHECKPOINT 1</div>
<div id="controls"><div class="group"><button class="btn" id="left">◀</button><button class="btn" id="right">▶</button></div><div class="group"><button class="btn" id="brake">▼</button><button class="btn" id="gas">▲</button></div></div>
<div id="impact"></div>
<div id="result"><div class="card"><h1>🏁 CORRIDA FINALIZADA</h1><div class="row"><span>Distância</span><b id="rDist">0 m</b></div><div class="row"><span>Velocidade máxima</span><b id="rMax">0 km/h</b></div><div class="row"><span>Checkpoints</span><b id="rCp">0 / 8</b></div><button id="garage">VOLTAR PARA GARAGEM</button></div></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import{getAuth,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
import*as THREE from"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";
const firebaseConfig={apiKey:"AIzaSyDaAt6kwcnwh6KWFmKdItI_aP-5aNlYiEg",authDomain:"jogo-92290.firebaseapp.com",projectId:"jogo-92290",storageBucket:"jogo-92290.firebasestorage.app",messagingSenderId:"237105815783",appId:"1:237105815783:web:51616c54633cedc2880242"};
const app=initializeApp(firebaseConfig),auth=getAuth(app);
let scene,camera,renderer,player,enemies=[],roadMarks=[],worldRoads=[];let speed=0,distance=0,maxSpeed=0,x=0;let gas=false,brake=false,left=false,right=false,finished=false,last=performance.now();let audio=null,audioEnabled=true,lastCollision=0,shake=0;let segment=0,segmentProgress=0,cpCount=0;let route=[];
class AudioEngine{constructor(){this.ctx=null;this.master=null;this.engine=null;this.engineGain=null;this.wind=null;this.windGain=null;this.road=null;this.roadGain=null;this.ambient=null;this.ambientGain=null;this.ready=false}start(){if(this.ready){this.ctx.resume();return}const C=window.AudioContext||window.webkitAudioContext;if(!C)return;this.ctx=new C();this.master=this.ctx.createGain();this.master.gain.value=.32;this.master.connect(this.ctx.destination);this.engine=this.ctx.createOscillator();this.engine.type='sawtooth';this.engineGain=this.ctx.createGain();this.engineGain.gain.value=.0001;this.engine.connect(this.engineGain).connect(this.master);this.engine.start();this.wind=this.ctx.createBufferSource();const b=this.ctx.createBuffer(1,this.ctx.sampleRate*2,this.ctx.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;this.wind.buffer=b;this.wind.loop=true;const wf=this.ctx.createBiquadFilter();wf.type='lowpass';wf.frequency.value=900;this.windGain=this.ctx.createGain();this.windGain.gain.value=.0001;this.wind.connect(wf).connect(this.windGain).connect(this.master);this.wind.start();this.road=this.ctx.createBufferSource();const rb=this.ctx.createBuffer(1,this.ctx.sampleRate*2,this.ctx.sampleRate),rd=rb.getChannelData(0);for(let i=0;i<rd.length;i++)rd[i]=Math.random()*2-1;this.road.buffer=rb;this.road.loop=true;const rf=this.ctx.createBiquadFilter();rf.type='bandpass';rf.frequency.value=110;rf.Q.value=.7;this.roadGain=this.ctx.createGain();this.roadGain.gain.value=.0001;this.road.connect(rf).connect(this.roadGain).connect(this.master);this.road.start();const a=this.ctx.createOscillator();a.type='sine';a.frequency.value=70;this.ambient=a;this.ambientGain=this.ctx.createGain();this.ambientGain.gain.value=.015;a.connect(this.ambientGain).connect(this.master);a.start();this.ready=true}update(){if(!this.ready||!audioEnabled)return;const t=Math.max(0,speed)/180;this.engine.frequency.setTargetAtTime(70+430*t,this.ctx.currentTime,.04);this.engineGain.gain.setTargetAtTime(.015+.09*t+(gas?.025:0),this.ctx.currentTime,.05);this.windGain.gain.setTargetAtTime(.008+.12*t*t,this.ctx.currentTime,.08);this.roadGain.gain.setTargetAtTime(.006+.055*t,this.ctx.currentTime,.08);this.ambientGain.gain.setTargetAtTime(.01+.012*t,this.ctx.currentTime,.15)}collision(){if(!this.ready||!audioEnabled)return;const o=this.ctx.createOscillator(),g=this.ctx.createGain();o.type='square';o.frequency.setValueAtTime(100,this.ctx.currentTime);o.frequency.exponentialRampToValueAtTime(35,this.ctx.currentTime+.22);g.gain.setValueAtTime(.22,this.ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,this.ctx.currentTime+.25);o.connect(g).connect(this.master);o.start();o.stop(this.ctx.currentTime+.26)}toggle(){audioEnabled=!audioEnabled;if(this.master)this.master.gain.value=audioEnabled?.32:0;return audioEnabled}}
audio=new AudioEngine();
onAuthStateChanged(auth,user=>{if(!user){location.href="index.html";return}iniciar()});
function iniciar(){scene=new THREE.Scene();scene.background=new THREE.Color(0x72add5);scene.fog=new THREE.Fog(0x72add5,110,650);camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,900);camera.position.set(0,5.5,11);renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;document.getElementById('jogo').appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0xffffff,0x34552f,2));const sun=new THREE.DirectionalLight(0xffffff,3);sun.position.set(-80,100,60);sun.castShadow=true;scene.add(sun);criarCidade();player=criarCarro(0xd50000);player.position.set(0,0,5);scene.add(player);for(let i=0;i<8;i++){const cores=[0x1565c0,0xffffff,0xff8800,0x151515,0x00a86b,0xaa22cc];const c=criarCarro(cores[i%cores.length]);c.position.set([-5,0,5][i%3],0,-90-i*85);scene.add(c);enemies.push(c)}controles();addEventListener('resize',resize);document.getElementById('sound').onclick=()=>{audio.start();const on=audio.toggle();document.getElementById('sound').textContent=on?'🔊 SOM':'🔇 SOM'};requestAnimationFrame(loop)}
function routePoint(z){const L=route.length-1;if(z<=route[0].z)return route[0];if(z>=route[L].z)return route[L];for(let i=0;i<L;i++){const a=route[i],b=route[i+1];if(z<=a.z&&z>=b.z){const t=(z-a.z)/(b.z-a.z);return{x:THREE.MathUtils.lerp(a.x,b.x,t),z};}}return{x:0,z}}
function criarCidade(){const grass=new THREE.Mesh(new THREE.PlaneGeometry(1400,1800),new THREE.MeshStandardMaterial({color:0x3d7137}));grass.rotation.x=-Math.PI/2;grass.position.set(0,-.08,-700);scene.add(grass);route=[{z:80,x:0},{z:-170,x:0},{z:-360,x:0},{z:-550,x:55},{z:-760,x:105},{z:-960,x:105},{z:-1160,x:25},{z:-1360,x:-80},{z:-1560,x:-115},{z:-1770,x:-115},{z:-1980,x:-35},{z:-2190,x:80},{z:-2400,x:130},{z:-2620,x:130},{z:-2840,x:30},{z:-3060,x:-95},{z:-3280,x:-130},{z:-3500,x:-40},{z:-3720,x:90},{z:-3940,x:90},{z:-4160,x:0},{z:-4380,x:-100},{z:-4600,x:-100},{z:-4820,x:0},{z:-5040,x:115},{z:-5260,x:115},{z:-5480,x:0}];
for(let i=0;i<route.length-1;i++){const a=route[i],b=route[i+1];criarTrecho(a,b)}
for(let i=0;i<150;i++){const z=-i*36-50;const side=i%2?-1:1;const cx=routePoint(z).x;criarPredio(cx+side*(19+Math.random()*26),z,6+Math.random()*22)}
for(let i=0;i<120;i++){const z=-i*45-80;const side=i%2?-1:1;const cx=routePoint(z).x;criarArvore(cx+side*(18+Math.random()*28),z)}
for(const z of[-600,-1200,-1850,-2500,-3150,-3850,-4550,-5250])criarCheckpoint(z);
criarIntersecoes();}
function criarTrecho(a,b){const dx=b.x-a.x,dz=b.z-a.z,len=Math.hypot(dx,dz),ang=Math.atan2(dx,dz);const mx=(a.x+b.x)/2,mz=(a.z+b.z)/2;const road=new THREE.Mesh(new THREE.PlaneGeometry(18,len),new THREE.MeshStandardMaterial({color:0x292929,roughness:.9}));road.rotation.x=-Math.PI/2;road.rotation.z=ang;road.position.set(mx,.0,mz);road.receiveShadow=true;scene.add(road);const shoulderMat=new THREE.MeshStandardMaterial({color:0xd8d8d8});for(const s of[-1,1]){const e=new THREE.Mesh(new THREE.BoxGeometry(.7,.05,len),shoulderMat);e.rotation.y=ang;e.rotation.x=0;e.position.set(mx+s*9*Math.cos(ang),.04,mz-s*9*Math.sin(ang));scene.add(e)}const n=Math.floor(len/12);for(let j=1;j<n;j++){const t=j/n;const px=THREE.MathUtils.lerp(a.x,b.x,t),pz=THREE.MathUtils.lerp(a.z,b.z,t);const mark=new THREE.Mesh(new THREE.BoxGeometry(.3,.05,5),new THREE.MeshStandardMaterial({color:0xffffff}));mark.rotation.y=ang;mark.rotation.x=-Math.PI/2;mark.position.set(px,.06,pz);scene.add(mark);roadMarks.push(mark)}worldRoads.push({a,b})}
function criarIntersecoes(){for(const z of[-1000,-2200,-3300,-4200]){const c=routePoint(z),cross=new THREE.Mesh(new THREE.PlaneGeometry(70,10),new THREE.MeshStandardMaterial({color:0x303030}));cross.rotation.x=-Math.PI/2;cross.position.set(c.x,.01,z);scene.add(cross);for(const s of[-1,1]){const arm=new THREE.Mesh(new THREE.PlaneGeometry(55,8),new THREE.MeshStandardMaterial({color:0x303030}));arm.rotation.x=-Math.PI/2;arm.rotation.z=Math.PI/2;arm.position.set(c.x+s*27,.012,z);scene.add(arm)}for(let k=-2;k<=2;k++){const line=new THREE.Mesh(new THREE.BoxGeometry(1.5,.03,6),new THREE.MeshBasicMaterial({color:0xf5f5f5}));line.position.set(c.x+k*3,.05,z-3);scene.add(line)}}}
function criarCheckpoint(z){const c=routePoint(z),g=new THREE.Group();const mat=new THREE.MeshStandardMaterial({color:0x00d9ff,emissive:0x005577});for(const s of[-1,1]){const p=new THREE.Mesh(new THREE.BoxGeometry(.45,5,.45),mat);p.position.set(c.x+s*6,2.5,z);g.add(p)}const bar=new THREE.Mesh(new THREE.BoxGeometry(12,.5,.45),mat);bar.position.set(c.x,5,z);g.add(bar);scene.add(g)}
function criarPredio(px,pz,h){const w=6+Math.random()*8,d=6+Math.random()*8;b=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshStandardMaterial({color:new THREE.Color().setHSL(.62,.08,.25+Math.random()*.22),roughness:.8}));b.position.set(px,h/2,pz);b.castShadow=true;scene.add(b);if(Math.random()<.65){for(let y=2;y<h-1;y+=3){const win=new THREE.Mesh(new THREE.BoxGeometry(w*.65,.35,.06),new THREE.MeshBasicMaterial({color:0xffd77a}));win.position.set(px,y,pz-d/2-.04);scene.add(win)}}}
function criarArvore(px,pz){const t=new THREE.Mesh(new THREE.CylinderGeometry(.3,.45,3,8),new THREE.MeshStandardMaterial({color:0x5b3822}));t.position.set(px,1.5,pz);scene.add(t);const c=new THREE.Mesh(new THREE.SphereGeometry(2.3,10,8),new THREE.MeshStandardMaterial({color:0x17602b}));c.position.set(px,4,pz);c.castShadow=true;scene.add(c)}
function criarCarro(color){const g=new THREE.Group();const body=new THREE.Mesh(new THREE.BoxGeometry(2.35,.65,4.5),new THREE.MeshStandardMaterial({color,metalness:.6,roughness:.3}));body.position.y=.75;body.castShadow=true;g.add(body);const roof=new THREE.Mesh(new THREE.BoxGeometry(1.65,.62,2),new THREE.MeshStandardMaterial({color:0x151515,metalness:.4}));roof.position.set(0,1.25,-.2);g.add(roof);const glass=new THREE.Mesh(new THREE.BoxGeometry(1.5,.42,.08),new THREE.MeshStandardMaterial({color:0x18354b,metalness:.2}));glass.position.set(0,1.3,.75);glass.rotation.x=-.25;g.add(glass);const wg=new THREE.CylinderGeometry(.42,.42,.32,16),wm=new THREE.MeshStandardMaterial({color:0x050505});for(const p of[[-1.22,.45,1.45],[1.22,.45,1.45],[-1.22,.45,-1.45],[1.22,.45,-1.45]]){const w=new THREE.Mesh(wg,wm);w.rotation.z=Math.PI/2;w.position.set(...p);g.add(w)}for(const xx of[-.7,.7]){const h=new THREE.Mesh(new THREE.BoxGeometry(.4,.18,.08),new THREE.MeshBasicMaterial({color:0xffffdd}));h.position.set(xx,.88,2.28);g.add(h)}return g}
function bind(id,on,off){const b=document.getElementById(id);b.addEventListener('pointerdown',e=>{e.preventDefault();audio.start();on()});b.addEventListener('pointerup',e=>{e.preventDefault();off()});b.addEventListener('pointercancel',off);b.addEventListener('pointerleave',off)}
function controles(){bind('left',()=>left=true,()=>left=false);bind('right',()=>right=true,()=>right=false);bind('gas',()=>gas=true,()=>gas=false);bind('brake',()=>brake=true,()=>brake=false);addEventListener('keydown',e=>{audio.start();if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')left=true;if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')right=true;if(e.key==='ArrowUp'||e.key.toLowerCase()==='w')gas=true;if(e.key==='ArrowDown'||e.key.toLowerCase()==='s')brake=true});addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')left=false;if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')right=false;if(e.key==='ArrowUp'||e.key.toLowerCase()==='w')gas=false;if(e.key==='ArrowDown'||e.key.toLowerCase()==='s')brake=false});document.getElementById('garage').onclick=()=>location.href='garagem.html'}
function atualizar(dt){if(gas)speed+=65*dt;else speed-=18*dt;if(brake)speed-=110*dt;speed=THREE.MathUtils.clamp(speed,0,180);maxSpeed=Math.max(maxSpeed,speed);let dir=(right?1:0)-(left?1:0);const targetX=routePoint(-distance/0.75).x; x+=dir*(8+speed*.045)*dt;const center=routePoint(-distance/0.75).x;x=THREE.MathUtils.clamp(x,center-7.1,center+7.1);player.position.x=x;player.position.z=5;player.rotation.z=THREE.MathUtils.lerp(player.rotation.z,-dir*.1,.15);player.rotation.y=THREE.MathUtils.lerp(player.rotation.y,-dir*.08,.12);distance+=speed*dt*.75;const move=speed*dt*.95;for(const m of roadMarks){m.position.z+=move;if(m.position.z>25)m.position.z-=5520}for(const c of enemies){c.position.z+=move;if(c.position.z>25){c.position.z=-5200-Math.random()*800;const center2=routePoint(c.position.z).x;c.position.x=center2+[-5,0,5][Math.floor(Math.random()*3)]}}
for(const c of enemies){if(c.position.z>-9&&c.position.z<11&&Math.abs(c.position.x-player.position.x)<2.1&&performance.now()-lastCollision>650){lastCollision=performance.now();speed*=.25;c.position.z-=7;shake=.75;audio.collision();const impact=document.getElementById('impact');impact.style.display='block';setTimeout(()=>impact.style.display='none',350)}}
cpCount=Math.min(8,Math.floor(distance/((5250/8)*.75)));document.getElementById('checkpoint').textContent='CHECKPOINT '+Math.max(1,Math.min(8,cpCount+1));document.getElementById('checkpoint').style.display=cpCount<8?'block':'none';audio.update();const shakeX=(Math.random()-.5)*shake*.22,shakeY=(Math.random()-.5)*shake*.14;shake=Math.max(0,shake-dt*2.8);camera.position.x=THREE.MathUtils.lerp(camera.position.x,x*.32,.08)+shakeX;camera.position.y=5.5+shakeY;camera.position.z=11;camera.lookAt(x*.15,.8,-35);document.getElementById('vel').textContent=Math.round(speed);document.getElementById('dist').textContent=Math.floor(distance);desenharMapa();if(distance>=4000)finalizar()}
function desenharMapa(){const c=document.getElementById('mapCanvas'),ctx=c.getContext('2d');ctx.clearRect(0,0,c.width,c.height);ctx.fillStyle='#111';ctx.fillRect(0,0,c.width,c.height);ctx.strokeStyle='#777';ctx.lineWidth=12;ctx.lineCap='round';ctx.beginPath();for(let i=0;i<route.length;i++){const p=route[i],mx=145+p.x*.48,my=18+(-p.z)*.034;i?ctx.lineTo(mx,my):ctx.moveTo(mx,my)}ctx.stroke();ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.stroke();const p=routePoint(-distance/0.75);ctx.fillStyle='#00e5ff';ctx.beginPath();ctx.arc(145+p.x*.48,18+(-p.z)*.034,7,0,Math.PI*2);ctx.fill()}
function finalizar(){if(finished)return;finished=true;document.getElementById('rDist').textContent=Math.floor(distance)+' m';document.getElementById('rMax').textContent=Math.round(maxSpeed)+' km/h';document.getElementById('rCp').textContent=Math.min(8,cpCount)+' / 8';document.getElementById('result').style.display='flex'}
function loop(){if(finished){renderer.render(scene,camera);return}const now=performance.now(),dt=Math.min((now-last)/1000,.05);last=now;atualizar(dt);renderer.render(scene,camera);requestAnimationFrame(loop)}
function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}
</script></body></html>
