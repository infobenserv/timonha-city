<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Street Racing - Garagem</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {

            font-family: Arial, Helvetica, sans-serif;

            min-height: 100vh;

            color: white;

            background:
                radial-gradient(
                    circle at 50% 20%,
                    #292929,
                    #090909 65%
                );
        }


        /* =========================
           TOPO
        ========================= */

        header {

            height: 70px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 0 25px;

            background: rgba(0,0,0,.85);

            border-bottom: 1px solid #333;
        }


        .logo {

            font-size: 22px;

            font-weight: 900;

            letter-spacing: 3px;
        }


        .btn-voltar {

            border: 1px solid #444;

            background: #151515;

            color: white;

            padding: 10px 18px;

            border-radius: 8px;

            cursor: pointer;
        }


        .btn-voltar:hover {

            background: #252525;
        }


        /* =========================
           CONTEÚDO
        ========================= */

        main {

            max-width: 1200px;

            margin: auto;

            padding: 30px 20px;
        }


        .titulo {

            margin-bottom: 25px;
        }


        .titulo small {

            color: #777;

            letter-spacing: 3px;
        }


        .titulo h1 {

            font-size: clamp(35px, 7vw, 60px);

            margin-top: 5px;
        }


        /* =========================
           CARRO
        ========================= */

        .garagem {

            display: grid;

            grid-template-columns:
                1.5fr
                1fr;

            gap: 20px;
        }


        .carro-area {

            min-height: 430px;

            border: 1px solid #333;

            border-radius: 18px;

            background:
                radial-gradient(
                    ellipse at center,
                    #303030,
                    #0b0b0b 70%
                );

            display: flex;

            align-items: center;

            justify-content: center;

            position: relative;

            overflow: hidden;
        }


        /* piso */

        .piso {

            position: absolute;

            width: 100%;

            height: 120px;

            bottom: 0;

            background:
                repeating-linear-gradient(
                    90deg,
                    #151515 0px,
                    #151515 80px,
                    #1b1b1b 81px,
                    #1b1b1b 160px
                );

            transform: perspective(250px)
                       rotateX(55deg);

            transform-origin: bottom;
        }


        /* CARRO TEMPORÁRIO */

        .carro {

            width: 310px;

            height: 120px;

            position: relative;

            z-index: 2;

            transform: translateY(25px);
        }


        .carro-corpo {

            position: absolute;

            width: 280px;

            height: 75px;

            left: 15px;

            top: 25px;

            background:
                linear-gradient(
                    #555,
                    #151515
                );

            border-radius:
                70px 100px 25px 25px;

            border: 2px solid #777;

            box-shadow:
                0 20px 35px rgba(0,0,0,.8);
        }


        .teto {

            position: absolute;

            width: 125px;

            height: 65px;

            left: 85px;

            top: -18px;

            background: #202020;

            border: 2px solid #777;

            border-radius: 70px 70px 5px 5px;
        }


        .vidro {

            position: absolute;

            width: 105px;

            height: 40px;

            left: 95px;

            top: -8px;

            background: #101820;

            border: 1px solid #555;

            border-radius: 40px 40px 3px 3px;
        }


        .roda {

            position: absolute;

            width: 52px;

            height: 52px;

            border-radius: 50%;

            background: #050505;

            border: 8px solid #292929;

            bottom: -5px;
        }


        .roda.esquerda {

            left: 42px;
        }


        .roda.direita {

            right: 42px;
        }


        .farol {

            position: absolute;

            width: 20px;

            height: 13px;

            right: 10px;

            top: 43px;

            border-radius: 50%;

            background: #eee;

            box-shadow:
                0 0 18px rgba(255,255,255,.8);
        }


        /* =========================
           PAINEL
        ========================= */

        .painel {

            border: 1px solid #333;

            border-radius: 18px;

            background: rgba(12,12,12,.95);

            padding: 25px;
        }


        .painel h2 {

            margin-bottom: 8px;
        }


        .nome-carro {

            color: #aaa;

            margin-bottom: 25px;
        }


        .status {

            margin-bottom: 25px;
        }


        .status-item {

            margin-bottom: 15px;
        }


        .status-item .linha {

            display: flex;

            justify-content: space-between;

            margin-bottom: 6px;

            font-size: 13px;

            color: #aaa;
        }


        .barra {

            height: 8px;

            background: #222;

            border-radius: 10px;

            overflow: hidden;
        }


        .barra div {

            height: 100%;

            width: 50%;

            background: #eee;

            border-radius: 10px;
        }


        /* =========================
           BOTÕES
        ========================= */

        .acoes {

            display: grid;

            gap: 10px;
        }


        .btn {

            padding: 14px;

            border-radius: 9px;

            border: 1px solid #444;

            background: #171717;

            color: white;

            cursor: pointer;

            font-weight: bold;
        }


        .btn:hover {

            background: #292929;
        }


        .btn-principal {

            background: white;

            color: black;

            border: none;
        }


        .btn-principal:hover {

            background: #ddd;
        }


        /* =========================
           INFORMAÇÕES
        ========================= */

        .info {

            margin-top: 20px;

            padding: 15px;

            border-radius: 10px;

            border: 1px solid #292929;

            background: #101010;

            color: #777;

            font-size: 13px;

            line-height: 1.5;
        }


        @media(max-width: 800px) {

            .garagem {

                grid-template-columns: 1fr;
            }


            .carro-area {

                min-height: 350px;
            }

        }

    </style>

</head>


<body>


<header>

    <div class="logo">
        STREET RACING
    </div>

    <button
        class="btn-voltar"
        id="btnVoltar"
    >
        ← MENU
    </button>

</header>


<main>


    <div class="titulo">

        <small>MINHA</small>

        <h1>GARAGEM</h1>

    </div>


    <div class="garagem">


        <!-- =========================
             CARRO
        ========================== -->

        <section class="carro-area">

            <div class="piso"></div>

            <div class="carro">

                <div class="carro-corpo"></div>

                <div class="teto"></div>

                <div class="vidro"></div>

                <div class="farol"></div>

                <div class="roda esquerda"></div>

                <div class="roda direita"></div>

            </div>

        </section>


        <!-- =========================
             PAINEL
        ========================== -->

        <section class="painel">

            <h2>CARRO INICIAL</h2>

            <div class="nome-carro">
                Street Racer
            </div>


            <div class="status">


                <div class="status-item">

                    <div class="linha">

                        <span>VELOCIDADE</span>

                        <span>50</span>

                    </div>

                    <div class="barra">
                        <div style="width:50%"></div>
                    </div>

                </div>


                <div class="status-item">

                    <div class="linha">

                        <span>ACELERAÇÃO</span>

                        <span>45</span>

                    </div>

                    <div class="barra">
                        <div style="width:45%"></div>
                    </div>

                </div>


                <div class="status-item">

                    <div class="linha">

                        <span>CONTROLE</span>

                        <span>55</span>

                    </div>

                    <div class="barra">
                        <div style="width:55%"></div>
                    </div>

                </div>


                <div class="status-item">

                    <div class="linha">

                        <span>FREIO</span>

                        <span>50</span>

                    </div>

                    <div class="barra">
                        <div style="width:50%"></div>
                    </div>

                </div>


            </div>


            <div class="acoes">

                <button
                    class="btn btn-principal"
                    id="btnCorrida"
                >
                    🏁 IR PARA CORRIDA
                </button>


                <button
                    class="btn"
                    id="btnMelhorias"
                >
                    🔧 MELHORIAS
                </button>


                <button
                    class="btn"
                    id="btnCarros"
                >
                    🚘 MEUS CARROS
                </button>

            </div>


            <div class="info">

                Este é o primeiro protótipo da garagem.
                Nas próximas etapas vamos adicionar veículos
                reais em 3D, compra de carros, upgrades,
                personalização e estatísticas.

            </div>

        </section>


    </div>

</main>



<script type="module">


    import {
        initializeApp
    }
    from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


    import {
        getAuth,
        onAuthStateChanged
    }
    from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


    const firebaseConfig = {

        apiKey:
            "AIzaSyDaAt6kwcnwh6KWFkMdItI_aP-5aNlYiEg",

        authDomain:
            "jogo-92290.firebaseapp.com",

        projectId:
            "jogo-92290",

        storageBucket:
            "jogo-92290.firebasestorage.app",

        messagingSenderId:
            "237105815783",

        appId:
            "1:237105815783:web:51616c54633cedc2880242"

    };


    const app =
        initializeApp(firebaseConfig);


    const auth =
        getAuth(app);


    /*
     * VERIFICAR LOGIN
     */

    onAuthStateChanged(
        auth,
        (user) => {

            if (!user) {

                window.location.href =
                    "index.html";

            }

        }
    );


    /*
     * VOLTAR
     */

    document
        .getElementById("btnVoltar")
        .addEventListener(
            "click",
            () => {

                window.location.href =
                    "index.html";

            }
        );


    /*
     * IR PARA CORRIDA
     */

    document
        .getElementById("btnCorrida")
        .addEventListener(
            "click",
            () => {

                window.location.href =
                    "corrida.html";

            }
        );


    /*
     * MELHORIAS
     */

    document
        .getElementById("btnMelhorias")
        .addEventListener(
            "click",
            () => {

                alert(
                    "Sistema de melhorias será adicionado na próxima etapa."
                );
            }
        );
    /*
     * MEUS CARROS
     */
    document
        .getElementById("btnCarros")
        .addEventListener(
            "click",
            () => {
                alert(
                    "Sistema de coleção de carros será adicionado na próxima etapa."
               );
            }
        );
</script>
</body>
</html>
