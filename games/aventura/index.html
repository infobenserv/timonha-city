<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Timonha City - Aventura</title>

<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #102a43;
}

#jogo {
    width: 100%;
    height: 100%;
}

canvas {
    display: block;
    margin: auto;
}

#controles {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 12px;

    display: flex;
    justify-content: space-between;
    align-items: flex-end;

    padding: 0 15px;

    z-index: 100;

    pointer-events: none;
}

.grupo {
    display: flex;
    gap: 12px;
    pointer-events: auto;
}

.botao {
    width: 65px;
    height: 65px;

    border: 2px solid white;
    border-radius: 50%;

    background: rgba(0,0,0,0.55);

    color: white;
    font-size: 28px;
    font-weight: bold;

    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
}

.botao:active {
    transform: scale(0.90);
    background: rgba(255,255,255,0.30);
}

</style>
</head>

<body>

<div id="jogo"></div>

<div id="controles">

    <div class="grupo">

        <button
            class="botao"
            id="esquerda">
            ⬅️
        </button>

        <button
            class="botao"
            id="direita">
            ➡️
        </button>

    </div>

    <div class="grupo">

        <button
            class="botao"
            id="pular">
            ⬆️
        </button>

    </div>

</div>


<script>

/* =====================================
   VARIÁVEIS
===================================== */

let cena;
let jogador;
let plataformas;
let teclas;

let esquerdaPressionada = false;
let direitaPressionada = false;

let pontuacao = 0;
let moedasPegas = 0;

let faseFinalizada = false;


/* =====================================
   CONFIGURAÇÃO
===================================== */

const configuracao = {

    type: Phaser.AUTO,

    parent: "jogo",

    width: 960,
    height: 540,

    backgroundColor: "#76c893",

    physics: {

        default: "arcade",

        arcade: {

            gravity: {
                y: 1000
            },

            debug: false
        }
    },

    scale: {

        mode: Phaser.Scale.FIT,

        autoCenter: Phaser.Scale.CENTER_BOTH
    },

    scene: {

        preload: preload,

        create: create,

        update: update
    }
};


const jogo =
    new Phaser.Game(configuracao);


/* =====================================
   PRELOAD
===================================== */

function preload() {
}


/* =====================================
   CREATE
===================================== */

function create() {

    cena = this;


    /* MUNDO */

    cena.physics.world.setBounds(
        0,
        0,
        6000,
        540
    );


    /* CÂMERA */

    cena.cameras.main.setBounds(
        0,
        0,
        6000,
        540
    );

    cena.cameras.main.setZoom(
        0.65
    );


    /* CENÁRIO */

    criarCenario();


    /* PLATAFORMAS */

    plataformas =
        cena.physics.add.staticGroup();


    const mapa = [

        [180,515,360,50],
        [610,515,180,50],
        [900,515,180,50],
        [1180,515,250,50],
        [1510,515,180,50],
        [1770,515,450,50],
        [2230,515,600,50],
        [2540,515,300,50],
        [2640,515,180,50],
        [3220,515,400,50],
        [3700,515,220,50],
        [4000,515,350,50],
        [4430,515,180,50],
        [4720,515,300,50],
        [5140,515,220,50],
        [5450,515,500,50],
        [700,390,150,30],
        [1050,350,160,30],
        [1400,400,150,30],
        [1950,380,160,30],
        [2350,340,150,30],
        [2750,390,160,30],
        [3100,350,170,30],
        [3550,380,150,30],
        [4150,360,160,30],
        [4600,390,150,30],
        [5000,350,170,30],
        [5350,390,160,30]
    ];


    mapa.forEach(function(p) {

        criarPlataforma(
            p[0],
            p[1],
            p[2],
            p[3]
        );

    });


    /* JOGADOR */

    jogador =
        cena.physics.add.sprite(
            230,
            430
        );


    jogador.setSize(
        32,
        42
    );


    jogador.setCollideWorldBounds(
        false
    );


    /* VISUAL DO JOGADOR */

    jogador.corpo =
        cena.add.rectangle(
            230,
            430,
            34,
            42,
            0xffcc66
        );


    jogador.olho =
        cena.add.circle(
            240,
            420,
            4,
            0x000000
        );


    /* COLISÃO */

    cena.physics.add.collider(
        jogador,
        plataformas
    );


    /* TECLADO */

    teclas =
        cena.input.keyboard.createCursorKeys();


    /* CÂMERA SEGUINDO */

    cena.cameras.main.startFollow(
        jogador,
        true,
        0.08,
        0.08
    );


    cena.cameras.main.setDeadzone(
        300,
        120
    );


    /* HUD */

    cena.add.text(
        20,
        20,
        "🌳 TIMONHA CITY",
        {
            fontSize: "22px",
            color: "#ffffff",
            fontStyle: "bold"
        }
    )
    .setScrollFactor(0);


    cena.add.text(
        20,
        50,
        "⬅️ ➡️ Mover   ⬆️ Pular",
        {
            fontSize: "16px",
            color: "#ffffff"
        }
    )
    .setScrollFactor(0);


    /* CONTROLES DE CELULAR */

    configurarControles();

}


/* =====================================
   UPDATE
===================================== */

function update() {

    if (
        !jogador ||
        !jogador.body ||
        faseFinalizada
    ) {
        return;
    }


    /* =================================
       MOVIMENTO
    ================================= */

    let velocidade = 0;


    if (
        teclas &&
        teclas.left &&
        teclas.left.isDown
    ) {

        velocidade = -250;

    }


    if (
        teclas &&
        teclas.right &&
        teclas.right.isDown
    ) {

        velocidade = 250;

    }


    /* CONTROLE TOUCH */

    if (esquerdaPressionada) {

        velocidade = -250;

    }


    if (direitaPressionada) {

        velocidade = 250;

    }


    jogador.setVelocityX(
        velocidade
    );


    /* =================================
       VISUAL
    ================================= */

    jogador.corpo.setPosition(
        jogador.x,
        jogador.y
    );


    jogador.olho.setPosition(
        jogador.x + 10,
        jogador.y - 10
    );


    /* =================================
       QUEDA
    ================================= */

    if (
        jogador.y > 600
    ) {

        jogador.setPosition(
            230,
            430
        );

        jogador.setVelocity(
            0,
            0
        );
    }


    /* =================================
       FINAL
    ================================= */

    if (
        jogador.x >= 5850
    ) {

        faseFinalizada = true;

        jogador.setVelocity(
            0,
            0
        );

        mostrarVitoria();
    }

}


/* =====================================
   PLATAFORMA
===================================== */

function criarPlataforma(
    x,
    y,
    largura,
    altura
) {

    const plataforma =
        cena.add.rectangle(
            x,
            y,
            largura,
            altura,
            0x5d4037
        );


    cena.physics.add.existing(
        plataforma,
        true
    );


    plataformas.add(
        plataforma
    );

}


/* =====================================
   CENÁRIO
===================================== */

function criarCenario() {

    cena.add.circle(
        820,
        100,
        50,
        0xffe066
    )
    .setScrollFactor(0.2);


    for (
        let x = 100;
        x < 6000;
        x += 300
    ) {

        criarArvore(
            x,
            430
        );

    }

}


/* =====================================
   ÁRVORE
===================================== */

function criarArvore(
    x,
    y
) {

    cena.add.rectangle(
        x,
        y + 25,
        20,
        60,
        0x7b4f2c
    );


    cena.add.circle(
        x,
        y - 10,
        40,
        0x2e7d32
    );


    cena.add.circle(
        x - 25,
        y + 5,
        30,
        0x388e3c
    );


    cena.add.circle(
        x + 25,
        y + 5,
        30,
        0x388e3c
    );

}


/* =====================================
   CONTROLES
===================================== */

function configurarControles() {

    const esquerda =
        document.getElementById(
            "esquerda"
        );


    const direita =
        document.getElementById(
            "direita"
        );


    const pular =
        document.getElementById(
            "pular"
        );


    /* ESQUERDA */

    esquerda.addEventListener(
        "pointerdown",
        function(e) {

            e.preventDefault();

            esquerdaPressionada = true;

        }
    );


    esquerda.addEventListener(
        "pointerup",
        function(e) {

            e.preventDefault();

            esquerdaPressionada = false;

        }
    );


    esquerda.addEventListener(
        "pointercancel",
        function() {

            esquerdaPressionada = false;

        }
    );


    /* DIREITA */

    direita.addEventListener(
        "pointerdown",
        function(e) {

            e.preventDefault();

            direitaPressionada = true;

        }
    );


    direita.addEventListener(
        "pointerup",
        function(e) {

            e.preventDefault();

            direitaPressionada = false;

        }
    );


    direita.addEventListener(
        "pointercancel",
        function() {

            direitaPressionada = false;

        }
    );


    /* PULO */

    pular.addEventListener(
        "pointerdown",
        function(e) {

            e.preventDefault();


            if (
                jogador &&
                jogador.body &&
                jogador.body.blocked.down
            ) {

                jogador.setVelocityY(
                    -500
                );

            }

        }
    );


    /* SOLTAR QUALQUER BOTÃO */

    window.addEventListener(
        "pointerup",
        function() {

            esquerdaPressionada =
                false;

            direitaPressionada =
                false;

        }
    );

}


/* =====================================
   VITÓRIA
===================================== */

function mostrarVitoria() {

    const largura =
        cena.cameras.main.width;


    const altura =
        cena.cameras.main.height;


    cena.add.rectangle(
        480,
        270,
        700,
        300,
        0x000000,
        0.85
    )
    .setScrollFactor(0);


    cena.add.text(
        480,
        210,
        "🏆 FASE CONCLUÍDA!",
        {
            fontSize: "42px",
            color: "#ffffff",
            fontStyle: "bold"
        }
    )
    .setOrigin(0.5)
    .setScrollFactor(0);


    cena.add.text(
        480,
        280,
        "Você chegou ao final!",
        {
            fontSize: "25px",
            color: "#ffffff"
        }
    )
    .setOrigin(0.5)
    .setScrollFactor(0);


    cena.add.text(
        480,
        340,
        "🌳 Timonha City",
        {
            fontSize: "22px",
            color: "#ffffff"
        }
    )
    .setOrigin(0.5)
    .setScrollFactor(0);

}

</script>

</body>
</html>
