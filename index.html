<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Timonha City</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main id="app">

        <section id="menu-cidade" class="tela">

            <header class="cabecalho">
                <div>
                    <h1>TIMONHA CITY</h1>
                    <p>Uma cidade. Vários jogos.</p>
                </div>

                <div class="status-jogador">
                    <div>👤 <span id="nomeJogador">Jogador</span></div>
                    <div>❤️ <span id="vidas">5</span></div>
                    <div>🪙 <span id="moedas">0</span></div>
                </div>
            </header>

            <section class="boas-vindas">
                <h2>Bem-vindo à cidade! 🏙️</h2>
                <p>Escolha uma aventura para começar.</p>
            </section>

            <section class="jogos">

                <button class="cartao-jogo" id="btnAventura">
                    <span class="icone">🌳</span>
                    <span class="titulo">AVENTURA</span>
                    <span class="descricao">Explore os mundos da Timonha City</span>
                </button>

                <button class="cartao-jogo" id="btnCorridas">
                    <span class="icone">🏎️</span>
                    <span class="titulo">CORRIDAS</span>
                    <span class="descricao">Corra contra seus amigos</span>
                </button>

                <button class="cartao-jogo" id="btnDesafios">
                    <span class="icone">🎯</span>
                    <span class="titulo">DESAFIOS</span>
                    <span class="descricao">Supere desafios especiais</span>
                </button>

            </section>

        </section>

    </main>

    <script type="module" src="js/app.js"></script>

</body>
</html>
